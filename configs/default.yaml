# Watchdog defaults used by capture helpers. The ICC manuscript did not transmit
# a jammer and did not train ML models; jammer/dataset keys below are unused.
# Historical header: Varotto et al., WIFS 2024 (not a claim of this paper).

experiment:
  name: varotto_wifs2024_repro
  seed: 42

radio:
  # Rede 5G NR (banda n78) — gNB Tower02: dl_arfcn 650000 ≈ 3750 MHz, 100 MHz, SCS 30, MIMO 2×2
  # IPs/interfaces: configs/lab_addrs.env | YAML: configs/gnb_n78_100mhz_x310.yml
  fc_hz: 3.750e9
  nr_bw_hz: 100e6
  scs_hz: 30e3
  # Jammer SSB (X410 172.16.2.241) — f_SSB do gNB (ARFCN≈647328) = 3709,92 MHz
  f_ssb_hz: 3.70992e9
  jammer_bw_hz: 7.2e6
  jammer_power_dbm: 10.0
  # Watchdog (outra WS)
  capture_bw_hz: 120e6          # faixa RF alvo: 3.69–3.81 GHz
  # Taxa efetiva das features ML após decimação (f_hi−f_lo). Captura X310: 200e6.
  fs_hz: 120e6
  mimo: "2x2"

spectrogram:
  n_fft: 1024                 # m = 1024 → ~117 kHz @ fs=120 MHz (escala com fs)
  n_psd: 100                  # n = 100 PSDs → ~0.8 ms @ fs do artigo
  hop: 1024                   # FFT simples sem overlap (como no artigo; Welch NÃO)
  eps: 1.0e-21                # f(x) = -log(x + eps)
  dtype: float32
  # Nunca usar PNG como entrada de ML — apenas .npy float

dataset:
  # Casos A/B → label 0 (legítimo); Caso C → label 1 (ataque)
  case_to_label:
    A: 0
    B: 0
    C: 1
  # Contagens absolutas (artigo / protocolo lab). Se definidas, ignoram as razões.
  n_train: 6000              # 3000 legítimo + 3000 ataque (com balance)
  n_val: 3000                # 1500 + 1500
  n_test: 1200               # 600 + 600
  # Frações (só se n_train/n_val/n_test forem null)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  balance_classes: true
  # Dentro do label 0, reparte A e B igualmente (evita dataset só com A+C)
  stratify_cases: true
  # Se true e sem contagens absolutas: divide por arquivo de captura
  split_by_file: true

# Análise multiclasse (notebook 02): cada caso é uma classe — dirs separados do binário
dataset_multiclass:
  case_to_label:
    A: 0   # idle
    B: 1   # tráfego
    C: 2   # jammer
  label_names:
    0: A
    1: B
    2: C
  n_classes: 3
  # Totais divisíveis por 3 → 2000/1000/400 por caso em train/val/test
  n_train: 6000
  n_val: 3000
  n_test: 1200

paths:
  raw_iq: data/raw                  # ML: train|val|test/caso{A,B,C}/  |  Fig.1: fig1/
  spectrograms: data/spectrograms   # features ML (.npy 100×1024)
  datasets: data/datasets           # binário A+B vs C
  datasets_multiclass: data/datasets_multiclass  # 3 classes A/B/C
  models: data/models
  models_multiclass: data/models_multiclass
  models_extra: data/models_extra                      # DT/RF/XGB/… binário
  models_multiclass_extra: data/models_multiclass_extra
  figures: data/figures             # métricas / legado
  figures_multiclass: data/figures/multiclass
  figures_extra: data/figures/extra
  figures_multiclass_extra: data/figures/multiclass_extra
  figures_ml: data/figures/ml       # previews diagnósticos ML (casoA/B/C)
  figures_fig1: data/figures/fig1   # reprodução Fig. 1 (eixos GHz × s)
  figures_online: data/figures/online  # monitor notebook 05 (casoA/B/C)
  online_reports: data/online/reports  # relatórios .md/.json do notebook 05

cnn:
  # Arquitetura Table I do artigo (keras/torch equivalente)
  epochs: 50
  batch_size: 32
  learning_rate: 1.0e-3
  early_stopping_patience: 10
  threshold_tau: 0.5
  use_gpu: true

knn:
  n_neighbors: 1              # artigo reporta melhor ~99.98% com k=1 + PCA
  pca_components: 8           # ~98% variância
  use_pca: true               # false → StandardScaler na PSD média (1024-D)
  metric: euclidean

svm:
  kernel: rbf                 # linear | poly | rbf
  pca_components: 8
  C: 1.0
  gamma: scale
  degree: 3                   # só para poly

# Métodos adicionais (notebooks 03/04) — mesma entrada PSD média + scaler/PCA
extra_ml:
  use_pca: true
  pca_components: 8
  models:
    - decision_tree
    - random_forest
    - extra_trees
    - gradient_boosting
    - xgboost
    - logistic_regression
    - gaussian_nb
    - mlp
    - kmeans
  decision_tree:
    max_depth: 12
    min_samples_leaf: 2
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    n_jobs: -1
  extra_trees:
    n_estimators: 200
    max_depth: null
    n_jobs: -1
  gradient_boosting:
    n_estimators: 150
    learning_rate: 0.1
    max_depth: 3
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    n_jobs: -1
  logistic_regression:
    C: 1.0
    max_iter: 1000
  mlp:
    hidden_layer_sizes: [128, 64]
    max_iter: 200
  kmeans:
    # null → usa n_classes da tarefa (2 binário / 3 multiclasse)
    n_clusters: null

latency:
  # Medição só do classificador (exclui FFT/espectrograma), CPU, sem GPU
  n_warmup: 20
  n_repeat: 500
  percentile: 95

# Detecção online (scripts/08_online_detect.py) — binário LEGITIMO vs ATAQUE
# Pré-requisito operacional: gNB UP. Sem rede, o espectro é OOD e p≈0.5.
online:
  model: svm                    # svm | knn | cnn  (artefatos em data/models/)
  # Zona cinza: threshold_legit < p < threshold_attack → INDETERMINADO
  threshold_attack: 0.85        # p ≥ isto → ATAQUE (alta confiança)
  threshold_legit: 0.15         # p ≤ isto → LEGITIMO
  vote_window: 5                # histórico de decisões
  min_vote_attack: 5            # alarme só com N votos ATAQUE (default = unânime)
  # label = maioria de rótulos duros | prob = limiar sobre a média de p na janela
  # (prob evita colapsar em INDETERMINADO quando p oscila na zona cinza)
  vote_mode: label
  # Limiares calibrados: python3 scripts/09_calibrate_thresholds.py --model svm --write
  min_psd_std: 0.35             # std(PSD média -log) abaixo → INDETERMINADO (ruído plano)
  log_jsonl: data/online/detections.jsonl
  reports_dir: data/online/reports   # notebook 05: caso{A,B,C}/{stamp}_*.md
  figures_dir: data/figures/online   # notebook 05: caso{A,B,C}/{stamp}_*.png
  replay_max_windows: null      # null = todas as janelas do .c64

viz:
  dpi: 200
  cmap: viridis
  save_preview_png: true      # preview ML: Frequency [GHz] × Time [s]

# ---------------------------------------------------------------------------
# Fluxo ML — coleta casos A/B/C (espectrogramas 100×1024) — INDEPENDENTE da Fig.1
# Scripts: ml_capture_case.sh / ml_collect_session.sh / ml_build_spectrograms.sh
# ---------------------------------------------------------------------------
ml_capture:
  # A = idle (jammer OFF); B = tráfego (jammer OFF); C = jammer ON @ G0
  cases: [A, B, C]
  splits: [train, val, test]
  # X310: 120e6 inválido. Opções ≥120 MHz de RF:
  #   200e6 (MCR 200) ou 184.32e6 (MCR 184.32 — exige master_clock_rate no UHD).
  # Build decima para 3.69–3.81 GHz (120 MHz). ~29–32 GB / 20 s.
  capture_fs_hz: 184.32e6
  master_clock_rate: 184.32e6
  f_lim_ghz: [3.69, 3.81]
  capture_seconds: 20.0
  capture_gain: 20             # RX dB — mesmo default pós-sweep Fig.1
  addr: "192.168.40.2"
  # Isolamento host durante captura (ModemManager NÃO é parado)
  isolate: true
  # Após cada captura, gerar .npy 100×1024 (01_build_spectrograms)
  build_spectrograms: true
  max_spectrograms_per_file: null   # null = todas as janelas do .c64
  # PNGs de inspeção (primeiro/meio/último) em data/figures/ml/caso{X}/
  ensure_preview_png: true
  n_preview_png: 3
  min_preview_png: 1                # falha se menos que isto após ensure
  # Espectrograma completo da captura (~20 s) no mesmo dir ml/caso{X}/
  # (estilo Fig.1; não é feature ML). Script: ml_plot_full_captures.py
  ensure_full_capture_png: true
  # Escala de cor fixa (log10 PSD) para A/B/C comparáveis. null → percentis Fig.1
  full_capture_clim: [-7.5, 0.0]
  # Checklist impresso no script (operador confirma na Tower02)
  prerequisites:
    A: "gNB UP; jammer OFF; UE idle / sem iperf"
    B: "gNB UP; jammer OFF; iperf/tráfego contínuo UE↔gNB"
    C: "gNB UP; jammer ON @ G0; tráfego deve falhar"

# Reprodução da Fig. 1 do artigo — fluxo SEPARADO (não misturar paths/scripts)
# X310 (Tower03): 120e6 inválido; use 200e6 (MCR 200) ou 184.32e6 (MCR 184.32)
fig1:
  title: null
  n_fft: 1024
  n_time_bins: 800             # resolução temporal da figura (não da feature ML)
  f_lim_ghz: [3.69, 3.81]      # eixo X do artigo (120 MHz em torno de 3.75 GHz)
  t_lim_s: [0.0, 20.0]         # eixo Y do artigo
  freq_axis: article           # article = f_lim fixo; physical = fc±fs/2
  cmap: turbo
  scale_mode: log10            # log10 | db | neglog — distinto de -log(x+ε) do ML
  dpi: 200
  # Escala de cor fixa (log10 PSD): frio=-7.5, quente=0. null → usa percentis
  clim: [-7.5, 0.0]
  clim_percentiles: [5, 99]    # só se clim for null
  notch_dc: false               # remove linha LO/DC em fc (só visualização Fig.1)
  # Captura ≥120 MHz de RF:
  capture_fs_hz: 184.32e6
  master_clock_rate: 184.32e6
  capture_seconds: 20.0
  capture_gain: 20             # RX dB — faixa HW 0–37.5; default lab pós-sweep
