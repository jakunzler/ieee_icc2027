# Watchdog defaults used by capture helpers. The ICC manuscript did not transmit
# a jammer and did not train ML models; jammer/dataset keys below are unused.
# Historical header: Varotto et al., WIFS 2024 (not a claim of this paper).

experiment:
  name: varotto_wifs2024_repro
  seed: 42

radio:
  # 5G NR (band n78) — gNB Tower02: dl_arfcn 650000 ≈ 3750 MHz, 100 MHz, SCS 30, MIMO 2×2
  # IPs/interfaces: configs/lab_addrs.env | YAML: configs/gnb_n78_100mhz_x310.yml
  fc_hz: 3.750e9
  nr_bw_hz: 100e6
  scs_hz: 30e3
  # Jammer SSB (X410 172.16.2.241) — f_SSB of gNB (ARFCN≈647328) = 3709,92 MHz
  f_ssb_hz: 3.70992e9
  jammer_bw_hz: 7.2e6
  jammer_power_dbm: 10.0
  # Watchdog (outra WS)
  capture_bw_hz: 120e6          # target RF range: 3.69–3.81 GHz
  # Effective rate of ML features after decimation (f_hi−f_lo). Capture X310: 200e6.
  fs_hz: 120e6
  mimo: "2x2"

spectrogram:
  n_fft: 1024                 # m = 1024 → ~117 kHz @ fs=120 MHz (scale with fs)
  n_psd: 100                  # n = 100 PSDs → ~0.8 ms @ fs of article
  hop: 1024                   # FFT simple without overlap (like in article; Welch NOT)
  eps: 1.0e-21                # f(x) = -log(x + eps)
  dtype: float32
  # Never use PNG as ML input — only .npy float

dataset:
  # Cases A/B → label 0 (legitimate); Case C → label 1 (attack)
  case_to_label:
    A: 0
    B: 0
    C: 1
  # Absolute counts (article / lab protocol). If defined, ignore cases.
  n_train: 6000              # 3000 legitimate + 3000 attack (with balance)
  n_val: 3000                # 1500 + 1500
  n_test: 1200               # 600 + 600
  # Fractions (only if n_train/n_val/n_test are null)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  balance_classes: true
  # Within label 0, split A and B equally (avoid dataset only with A+C)
  stratify_cases: true
  # If true and no absolute counts: split by capture file
  split_by_file: true

# Multiclass analysis (notebook 02): each case is a class — separate binary dirs
dataset_multiclass:
  case_to_label:
    A: 0   # idle
    B: 1   # traffic
    C: 2   # jammer
  label_names:
    0: A
    1: B
    2: C
  n_classes: 3
  # Total divisible by 3 → 2000/1000/400 per case in train/val/test
  n_train: 6000
  n_val: 3000
  n_test: 1200

paths:
  raw_iq: data/raw                  # ML: train|val|test/case{A,B,C}/  |  Fig.1: fig1/
  spectrograms: data/spectrograms   # features ML (.npy 100×1024)
  datasets: data/datasets           # binary A+B vs C
  datasets_multiclass: data/datasets_multiclass  # 3 classes A/B/C
  models: data/models
  models_multiclass: data/models_multiclass
  models_extra: data/models_extra                      # DT/RF/XGB/… binary
  models_multiclass_extra: data/models_multiclass_extra
  figures: data/figures             # metrics / legacy
  figures_multiclass: data/figures/multiclass
  figures_extra: data/figures/extra
  figures_multiclass_extra: data/figures/multiclass_extra
  figures_ml: data/figures/ml       # previews diagnostic ML (caseA/B/C)
  figures_fig1: data/figures/fig1   # reproduction Fig. 1 (GHz × s axes)
  figures_online: data/figures/online  # monitor notebook 05 (casoA/B/C)
  online_reports: data/online/reports  # reports .md/.json of notebook 05

cnn:
  # Architecture Table I of article (keras/torch equivalent)
  epochs: 50
  batch_size: 32
  learning_rate: 1.0e-3
  early_stopping_patience: 10
  threshold_tau: 0.5
  use_gpu: true

knn:
  n_neighbors: 1              # article reports better ~99.98% with k=1 + PCA
  pca_components: 8           # ~98% variance
  use_pca: true               # false → StandardScaler on mean PSD (1024-D)
  metric: euclidean

svm:
  kernel: rbf                 # linear | poly | rbf (article)
  pca_components: 8
  C: 1.0
  gamma: scale
  degree: 3                   # only for polynomial

# Additional methods (notebooks 03/04) — same mean PSD input + scaler/PCA
extra_ml:
  use_pca: true
  pca_components: 8
  models:
    - decision_tree
    - random_forest
    - extra_trees
    - gradient_boosting
    - xgboost
    - logistic_regression
    - gaussian_nb
    - mlp
    - kmeans
  decision_tree:
    max_depth: 12
    min_samples_leaf: 2
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    n_jobs: -1
  extra_trees:
    n_estimators: 200
    max_depth: null
    n_jobs: -1
  gradient_boosting:
    n_estimators: 150
    learning_rate: 0.1
    max_depth: 3
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    n_jobs: -1
  logistic_regression:
    C: 1.0
    max_iter: 1000
  mlp:
    hidden_layer_sizes: [128, 64]
    max_iter: 200
  kmeans:
    # null → use n_classes of task (2 binary / 3 multiclass)
    n_clusters: null

latency:
  # Measurement only of classifier (excludes FFT/spectrogram), CPU, no GPU
  n_warmup: 20
  n_repeat: 500
  percentile: 95

# Online detection (scripts/08_online_detect.py) — binary LEGITIMO vs ATAQUE
# Operational prerequisite: gNB UP. Without network, the spectrum is OOD and p≈0.5.
online:
  model: svm                    # svm | knn | cnn  (artifacts in data/models/)
  # Grey zone: threshold_legit < p < threshold_attack → INDETERMINATE
  threshold_attack: 0.85        # p ≥ this → ATTACK (high confidence)
  threshold_legit: 0.15         # p ≤ this → LEGITIMO
  vote_window: 5                # decision history
  min_vote_attack: 5            # alarm only with N attack votes (default = unanimous)
  # label = majority of hard labels | prob = threshold on mean p in window
  # (prob avoids collapsing to INDETERMINATE when p oscillates in grey zone)
  vote_mode: label
  # Calibrated thresholds: python3 scripts/09_calibrate_thresholds.py --model svm --write
  min_psd_std: 0.35             # std(mean PSD -log) below → INDETERMINATE (flat noise) (article)
  log_jsonl: data/online/detections.jsonl
  reports_dir: data/online/reports   # notebook 05: case{A,B,C}/{stamp}_*.md
  figures_dir: data/figures/online   # notebook 05: case{A,B,C}/{stamp}_*.png
  replay_max_windows: null      # null = all windows of .c64

viz:
  dpi: 200
  cmap: viridis
  save_preview_png: true      # preview ML: Frequency [GHz] × Time [s] (article)

# ---------------------------------------------------------------------------
# ML flow — collect cases A/B/C (spectrograms 100×1024) — INDEPENDENT of Fig.1
# Scripts: ml_capture_case.sh / ml_collect_session.sh / ml_build_spectrograms.sh
# ---------------------------------------------------------------------------
ml_capture:
  # A = idle (jammer OFF); B = traffic (jammer OFF); C = jammer ON @ G0
  cases: [A, B, C]
  splits: [train, val, test]
  # X310: 120e6 invalid. Options ≥120 MHz of RF:
  #   200e6 (MCR 200) or 184.32e6 (MCR 184.32 — requires master_clock_rate in UHD).
  # Build decimation for 3.69–3.81 GHz (120 MHz). ~29–32 GB / 20 s.
  capture_fs_hz: 184.32e6
  master_clock_rate: 184.32e6
  f_lim_ghz: [3.69, 3.81]
  capture_seconds: 20.0
  capture_gain: 20             # RX dB — same default post-sweep Fig.1
  addr: "192.168.40.2"
  # Isolation during capture (ModemManager NOT stopped)
  isolate: true
  # After each capture, generate .npy 100×1024 (01_build_spectrograms)
  build_spectrograms: true
  max_spectrograms_per_file: null   # null = all windows of .c64
  # Inspection PNGs (first/middle/last) in data/figures/ml/case{X}/
  ensure_preview_png: true
  n_preview_png: 3
  min_preview_png: 1                # fail if less than this after ensure
  # Full spectrogram of capture (~20 s) in same dir ml/case{X}/
  # (like Fig.1; not ML feature). Script: ml_plot_full_captures.py
  ensure_full_capture_png: true
  # Fixed color scale (log10 PSD) for comparable A/B/C. null → percentiles Fig.1
  full_capture_clim: [-7.5, 0.0]
  # Checklist printed in script (operator confirms on Tower02)
  prerequisites:
    A: "gNB UP; jammer OFF; UE idle / no iperf"
    B: "gNB UP; jammer OFF; iperf/continuous traffic UE↔gNB"
    C: "gNB UP; jammer ON @ G0; traffic should fail"

# Reproduction of Fig. 1 of article — separate flow (do not mix paths/scripts)
# X310 (Tower03): 120e6 invalid; use 200e6 (MCR 200) or 184.32e6 (MCR 184.32)
fig1:
  title: null
  n_fft: 1024
  n_time_bins: 800             # temporal resolution of figure (not ML feature)
  f_lim_ghz: [3.69, 3.81]      # article X axis (120 MHz around 3.75 GHz)
  t_lim_s: [0.0, 20.0]         # article Y axis
  freq_axis: article           # article = fixed f_lim; physical = fc±fs/2
  cmap: turbo
  scale_mode: log10            # log10 | db | neglog — distinct from -log(x+ε) of ML
  dpi: 200
  # Fixed color scale (log10 PSD): cold=-7.5, hot=0. null → use percentiles
  clim: [-7.5, 0.0]
  clim_percentiles: [5, 99]    # only if clim is null
  notch_dc: false               # remove LO/DC line in fc (only visual Fig.1)
  # Capture ≥120 MHz of RF:
  capture_fs_hz: 184.32e6
  master_clock_rate: 184.32e6
  capture_seconds: 20.0
  capture_gain: 20             # RX dB — HW range 0–37.5; default lab post-sweep
