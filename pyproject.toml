[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caif-sdr-pipeline"
version = "0.1.0"
description = "Traceable SDR acquisition and frozen PSS/SSS identification for the CAIF ICC manuscript"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10,<1.15",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
uhd = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
